<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineMatch – filmes parecidos</title>
<style>
:root{--bg:#0b0b0f;--fg:#f5f3f7;--mut:#9a95a5;--card:#16151c;--line:#26242e;--red:#ff2a45;--red2:#b3001b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
a{color:inherit}
.rail{position:fixed;left:0;top:0;bottom:0;width:60px;background:#111016;border-right:1px solid var(--line);display:none;flex-direction:column;align-items:center;gap:14px;padding-top:84px;z-index:40}
.rail a{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--mut)}
.rail a:hover{background:var(--card);color:var(--fg)}
@media(min-width:900px){.rail{display:flex}body{padding-left:60px}}
.nav{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr minmax(240px,520px) 1fr;gap:16px;align-items:center;padding:14px 24px;background:rgba(11,11,15,.88);backdrop-filter:blur(10px)}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}.logo b{color:var(--red)}
.sbox{position:relative;width:100%}
.search{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;transition:.2s}
.search:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,42,69,.2)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:.95rem;padding:9px 16px;outline:none}
.search button{border:0;border-radius:999px;padding:0 20px;font-weight:700;color:#fff;cursor:pointer;background:var(--red)}
#sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;z-index:50;display:none;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#sug div{display:flex;gap:12px;align-items:center;padding:8px 14px;cursor:pointer}
#sug div:hover,#sug div.on{background:rgba(255,42,69,.15)}
#sug img,#sug i{width:34px;height:50px;border-radius:5px;object-fit:cover;background:var(--line);flex:none}
#sug small{color:var(--mut)}
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;overflow:hidden;margin:8px 24px 0;border-radius:24px;background:#15131b}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 0%,rgba(11,11,15,.85) 35%,transparent 80%),linear-gradient(0deg,var(--bg),transparent 45%),radial-gradient(circle at 85% 25%,rgba(255,42,69,.35),transparent 50%)}
.hin{position:relative;z-index:2;max-width:560px;padding:40px}
.lab{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700}
.hin h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.05;margin:8px 0 12px;letter-spacing:-.03em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--mut)}
.hin p{color:#cfcad6;font-size:.95rem;margin:14px 0 20px}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 26px;font-weight:700;color:#fff;background:var(--red);cursor:pointer;text-decoration:none;font-size:.9rem}
.morewrap{text-align:center;margin-top:26px}
.btn.ghost:hover{background:var(--red)}
.btn.ghost{background:rgba(255,255,255,.14)}
.tag{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:0 4px 4px 0}
.tag.hit{border-color:var(--red);color:#ff8a9a}
.rate{color:#ffd43b;font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 60px}
h2{font-size:1.25rem;margin:44px 0 16px}.c{text-align:center;font-size:1.6rem}
.filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
.filters select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;outline:none}
.filters select:focus{border-color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:640px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.cards{grid-template-columns:repeat(5,1fr)}}
.pc{animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.pp{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.bd span{background:rgba(0,0,0,.7);border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:700}
.bd .gem{background:linear-gradient(90deg,var(--red),var(--red2))}
.ov{position:absolute;inset:0;z-index:3;background:linear-gradient(0deg,rgba(0,0,0,.96),rgba(0,0,0,.75));padding:14px;display:flex;flex-direction:column;gap:8px;opacity:0;transition:.25s;overflow:auto;font-size:.78rem}
.pc:hover .ov,.pc.open .ov{opacity:1}
.ov p{margin:0;color:#d7d2de}
.pt{margin-top:8px;font-weight:600;font-size:.9rem}.pt small{color:var(--mut);font-weight:400}
.prov{color:var(--mut)}
.prov div{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.prov img{width:24px;height:24px;border-radius:6px}
.seenbtn{background:transparent;color:#fff;border:1px solid var(--red);border-radius:999px;padding:5px 14px;font-size:.75rem;cursor:pointer}
.seenbtn:hover{background:var(--red)}
.tmdb{font-size:.75rem;color:var(--mut);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);transition:transform .25s}
.poster:hover{transform:translateY(-6px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster span{position:absolute;inset:auto 0 0 0;padding:30px 10px 10px;font-weight:700;font-size:.82rem;background:linear-gradient(transparent,rgba(0,0,0,.88))}
#status{text-align:center;color:var(--mut);margin:30px 0 0;display:none}
#status.err{color:var(--red)}
.loader{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
#results{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:.8rem;margin:0 6px 6px 0}
.chip button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1rem;line-height:1}
.mut{color:var(--mut);text-align:center}
footer{text-align:center;color:var(--mut);font-size:.78rem;margin-top:50px}
footer a{color:var(--red)}
@media(max-width:760px){.nav{grid-template-columns:1fr;gap:10px}.logo{text-align:center}}
@media(max-width:520px){.hero{margin:8px 12px 0;min-height:380px}.hin{padding:24px}.nav{padding:12px}.wrap{padding:0 12px 50px}}
</style>
</head>
<body>
<nav class="rail"><a href="#" title="Início">🏠</a><a href="#seenBox" title="Já vi">✓</a><a href="#classics" title="Clássicos">🎞️</a></nav>
<header class="nav">
  <div class="logo">Cine<b>Match</b></div>
  <div class="sbox">
    <div class="search"><input id="q" placeholder="Digite um filme que você gosta…" autocomplete="off" aria-label="Nome do filme"><button id="go">Buscar</button></div>
    <div id="sug"></div>
  </div>
</header>
<section class="hero" id="hero"></section>
<div class="wrap">
<div id="status"></div>
<section id="results">
  <h2 class="c">Recomendações para você</h2>
  <div class="filters" id="filters">
    <select id="fg" aria-label="Gênero"></select>
    <select id="fd" aria-label="Época"></select>
    <select id="fr" aria-label="Nota mínima"><option value="0">Qualquer nota</option><option value="6">Nota 6+</option><option value="7">Nota 7+</option><option value="8">Nota 8+</option></select>
  </div>
  <div class="cards" id="recs"></div>
  <div class="morewrap"><button class="btn ghost" id="more" style="display:none">Ver mais 5</button></div>
</section>
<section id="seenBox" style="display:none"><h2>Filmes que você já viu</h2><div id="seen"></div></section>
<h2>Clássicos para começar</h2>
<div class="grid" id="classics"></div>
<footer>Este produto usa a API do TMDB, mas não é endossado ou certificado pelo <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. Dados de onde assistir: JustWatch.</footer>
</div>

<script>
const LANG = "pt-BR";
const IMG = "https://image.tmdb.org/t/p/w342";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Todas as chamadas passam pela função do Netlify, que guarda a chave no servidor.
async function api(path, params = {}) {
  const u = new URL("/.netlify/functions/tmdb", location.origin);
  u.searchParams.set("path", path);
  u.searchParams.set("language", LANG);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const r = await fetch(u);
  if (r.status === 500) throw new Error("Servidor sem chave configurada (variável TMDB_KEY no Netlify).");
  if (r.status === 401) throw new Error("Chave do TMDB inválida.");
  if (!r.ok) throw new Error("Erro ao consultar o TMDB (" + r.status + ").");
  return r.json();
}
const safe = p => p.catch(() => ({ results: [] }));

/* ---------- Clássicos na home ---------- */
const CLASSICS = [["Casablanca",1942],["2001: A Space Odyssey",1968],["The Godfather",1972],["Psycho",1960],["Singin' in the Rain",1952],["Seven Samurai",1954],["Taxi Driver",1976],["Blade Runner",1982],["The Shining",1980],["Central do Brasil",1998],["Jaws",1975],["Metropolis",1927]];
async function loadClassics() {
  const rs = (await Promise.all(CLASSICS.map(([t, y]) => safe(api("/search/movie", { query: t, year: y })).then(r => r.results[0])))).filter(Boolean);
  $("classics").innerHTML = rs.map(m => `<div class="poster" data-id="${m.id}">${m.poster_path ? `<img loading="lazy" src="${IMG + m.poster_path}" alt="${esc(m.title)}">` : ""}<span>${esc(m.title)} · ${(m.release_date || "").slice(0, 4)}</span></div>`).join("");
  const h = rs.filter(m => m.backdrop_path && m.overview);
  if (h.length && !S) { const m = h[Math.floor(Math.random() * h.length)]; hero(m, "Clássico em destaque", m.genre_ids.map(x => G[x]).filter(Boolean), `<button class="btn" data-rec="${m.id}">Ver filmes parecidos</button>`); }
}
$("classics").addEventListener("click", e => { const p = e.target.closest(".poster"); if (p) recommend(+p.dataset.id); });

/* ---------- Busca com sugestões ---------- */
const q = $("q"), sug = $("sug"); let timer, hits = [], cur = -1;
q.addEventListener("input", () => {
  clearTimeout(timer);
  if (q.value.trim().length < 2) { sug.style.display = "none"; return; }
  timer = setTimeout(async () => {
    try { hits = (await api("/search/movie", { query: q.value.trim() })).results.slice(0, 6); } catch { hits = []; }
    cur = -1;
    sug.innerHTML = hits.map((m, i) => `<div data-i="${i}">${m.poster_path ? `<img src="${IMG + m.poster_path}" alt="">` : "<i></i>"}<span>${esc(m.title)} <small>${(m.release_date || "").slice(0, 4)}</small></span></div>`).join("");
    sug.style.display = hits.length ? "block" : "none";
  }, 250);
});
sug.addEventListener("click", e => { const d = e.target.closest("div"); if (d) pick(hits[+d.dataset.i]); });
q.addEventListener("keydown", e => {
  const items = [...sug.children];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((x, i) => x.classList.toggle("on", i === cur));
  } else if (e.key === "Enter") { cur >= 0 ? pick(hits[cur]) : go(); }
  else if (e.key === "Escape") sug.style.display = "none";
});
document.addEventListener("click", e => { if (!e.target.closest(".sbox")) sug.style.display = "none"; });
function pick(m) { if (!m) return; q.value = m.title; sug.style.display = "none"; recommend(m.id); }
async function go() {
  const t = q.value.trim(); if (!t) return q.focus();
  sug.style.display = "none"; say("loader", "Procurando “" + esc(t) + "”…");
  try {
    const r = (await api("/search/movie", { query: t })).results[0];
    if (!r) return say("err", "Não encontrei esse filme. Tente outro nome.");
    q.value = r.title; recommend(r.id);
  } catch (e) { say("err", esc(e.message)); }
}
$("go").onclick = go;

function say(kind, html) {
  const s = $("status"); s.style.display = html ? "block" : "none";
  s.className = kind === "err" ? "err" : "";
  s.innerHTML = (kind === "loader" ? '<span class="loader"></span>' : "") + html;
}

/* ---------- Motor de similaridade ---------- */
const STOP = new Set("para como mais mas uma uns umas que com por dos das nos nas seu sua seus suas ele ela eles elas entre sobre quando depois ainda onde cada pela pelo pelos pelas isso esse essa este esta mesmo tambem apos ate sem muito tudo todo toda vida filme historia the and with that his her from into who when their".split(" "));
const tok = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/[^a-z]+/).filter(w => w.length > 3 && !STOP.has(w));
function buildVecs(texts) {
  const docs = texts.map(t => { const m = {}; tok(t).forEach(w => m[w] = (m[w] || 0) + 1); return m; });
  const df = {}; docs.forEach(d => Object.keys(d).forEach(w => df[w] = (df[w] || 0) + 1));
  return docs.map(d => { const v = {}; let n = 0; for (const w in d) { v[w] = d[w] * Math.log(1 + docs.length / df[w]); n += v[w] ** 2; } return { v, n: Math.sqrt(n) || 1 }; });
}
const cos = (a, b) => { let s = 0; for (const w in a.v) if (b.v[w]) s += a.v[w] * b.v[w]; return s / (a.n * b.n); };
const jac = (a, b) => { const A = new Set(a), B = new Set(b), i = [...A].filter(x => B.has(x)).length; return i / (A.size + B.size - i || 1); };

let busy = false;
async function recommend(id) {
  if (busy) return; busy = true; $("results").style.display = "none";
  say("loader", "Comparando sinopses e gêneros…");
  try {
    const base = await api("/movie/" + id, { append_to_response: "keywords" });
    const gids = base.genres.map(g => g.id), gname = Object.fromEntries(base.genres.map(g => [g.id, g.name]));
    const kws = (base.keywords?.keywords || []).slice(0, 6).map(k => k.id);
    const disc = extra => safe(api("/discover/movie", { with_genres: gids.slice(0, 2).join(","), ...(kws.length ? { with_keywords: kws.join("|") } : {}), ...extra }));
    const [rec, sim, pop, gems1, gems2, gl] = await Promise.all([
      safe(api(`/movie/${id}/recommendations`)), safe(api(`/movie/${id}/similar`)),
      disc({ sort_by: "vote_count.desc", "vote_count.gte": 300 }),
      disc({ sort_by: "vote_average.desc", "vote_count.gte": 120, "vote_count.lte": 2500, "vote_average.gte": 6.4 }),
      disc({ sort_by: "vote_average.desc", "vote_count.gte": 120, "vote_count.lte": 2500, "vote_average.gte": 6.4, page: 2 }),
      safe(api("/genre/movie/list"))
    ]);
    (gl.genres || []).forEach(g => gname[g.id] = g.name);
    const inRec = new Set(rec.results.map(m => m.id));
    const seen = new Map();
    [...rec.results, ...sim.results, ...pop.results, ...gems1.results, ...gems2.results].forEach(m => { if (m.id !== id && m.overview && m.poster_path && !seen.has(m.id)) seen.set(m.id, m); });
    const cands = [...seen.values()];
    const vecs = buildVecs([base.overview, ...cands.map(m => m.overview)]);
    cands.forEach((m, i) => {
      m.score = 0.45 * cos(vecs[0], vecs[i + 1]) * 3 + 0.35 * jac(gids, m.genre_ids) + 0.1 * (inRec.has(m.id) ? 1 : 0) + 0.1 * (m.vote_average / 10);
      m.obscure = m.vote_count <= 2500 && m.vote_average >= 6.3;
    });
    if (!cands.length) throw new Error("Não achei filmes parecidos para esse título.");
    cands.sort((a, b) => b.score - a.score);
    S = { base, cands, gname, gids, more: 0, prev: 0 };
    buildFilters(); say("", ""); showRecs(true);
  } catch (e) { say("err", esc(e.message)); }
  busy = false;
}

const BG = "https://image.tmdb.org/t/p/w1280", G = {};
async function loadGenres() { ((await safe(api("/genre/movie/list"))).genres || []).forEach(g => G[g.id] = g.name); }
function hero(m, label, genres, btn) {
  const y = (m.release_date || "").slice(0, 4), o = m.overview || "";
  $("hero").innerHTML = `<div class="hbg" ${m.backdrop_path ? `style="background-image:url(${BG + m.backdrop_path})"` : ""}></div><div class="hin"><span class="lab">${label}</span><h1>${esc(m.title)}</h1><div class="meta"><span class="rate">★ ${m.vote_average.toFixed(1)}</span><span>${y}</span>${genres.slice(0, 3).map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div><p>${esc(o.length > 300 ? o.slice(0, 297) + "…" : o)}</p>${btn}</div>`;
}
$("hero").addEventListener("click", e => { const b = e.target.closest("[data-rec]"); if (b) recommend(+b.dataset.rec); });
function pcard(m, genres, shared, gem, i) {
  const y = (m.release_date || "").slice(0, 4);
  const tags = genres.slice(0, 4).map(g => `<span class="tag ${shared.includes(g) ? "hit" : ""}">${esc(g)}</span>`).join("");
  const o = m.overview.length > 150 ? m.overview.slice(0, 147) + "…" : m.overview;
  return `<div class="pc" style="${i < (S.prev || 0) ? "animation:none" : `animation-delay:${(i % 5) * 90}ms`}"><div class="pp"><img src="${IMG + m.poster_path}" alt="${esc(m.title)}"><div class="bd">${gem ? '<span class="gem">💎 Joia</span>' : ""}<span>★ ${m.vote_average.toFixed(1)}</span></div><div class="ov"><div>${tags}</div><p>${esc(o)}</p><div class="prov" id="p-${m.id}"><small>Buscando onde assistir…</small></div><div><button class="seenbtn" data-id="${m.id}">✓ Já vi</button><a class="tmdb" href="https://www.themoviedb.org/movie/${m.id}" target="_blank" rel="noopener">Ver no TMDB</a></div></div></div><div class="pt">${esc(m.title)} <small>${y}</small></div></div>`;
}

/* ---------- Filtros, "já vi" e onde assistir ---------- */
let S = null;
const decade = m => { const y = +(m.release_date || "").slice(0, 4); return y ? Math.floor(y / 10) * 10 : 0; };
function getSeen() { try { return JSON.parse(localStorage.getItem("cm_seen") || "{}"); } catch { return {}; } }
function setSeen(o) { try { localStorage.setItem("cm_seen", JSON.stringify(o)); } catch {} }

function buildFilters() {
  const gs = new Map(), ds = new Set();
  S.cands.forEach(m => { m.genre_ids.forEach(g => S.gname[g] && gs.set(g, S.gname[g])); if (decade(m)) ds.add(decade(m)); });
  $("fg").innerHTML = '<option value="">Todos os gêneros</option>' + [...gs].sort((a, b) => a[1].localeCompare(b[1])).map(([i, n]) => `<option value="${i}">${esc(n)}</option>`).join("");
  $("fd").innerHTML = '<option value="">Qualquer época</option>' + [...ds].sort().map(d => `<option value="${d}">Anos ${d}</option>`).join("");
  $("fr").value = "0";
}

function showRecs(scroll, more) {
  const { base, cands, gname, gids } = S, seen = getSeen();
  const g = $("fg").value, d = +$("fd").value, r = +$("fr").value;
  const pool = cands.filter(m => !seen[m.id] && (!g || m.genre_ids.includes(+g)) && (!d || decade(m) === d) && m.vote_average >= r);
  const gem = pool.find(m => m.obscure);
  const first = [...pool.filter(m => m !== gem && !(m.obscure && m.vote_count < 600)).slice(0, 4), gem].filter(Boolean);
  if (first.length < 5) pool.forEach(m => { if (first.length < 5 && !first.includes(m)) first.push(m); });
  first.sort((a, b) => b.score - a.score);
  const rest = pool.filter(m => !first.includes(m)), n = (S.more || 0) * 5, left = rest.length - n;
  const final = [...first, ...rest.slice(0, n)];
  if (!more) hero(base, "Seu filme", base.genres.map(x => x.name), `<a class="btn ghost" href="https://www.themoviedb.org/movie/${base.id}" target="_blank" rel="noopener">Ver no TMDB</a>`);
  $("recs").innerHTML = final.length
    ? final.map((m, i) => pcard(m, m.genre_ids.map(x => gname[x]).filter(Boolean), gids.map(x => gname[x]), m === gem, i)).join("")
    : '<p class="mut" style="grid-column:1/-1">Nenhum filme com esses filtros. Tente afrouxar algum deles.</p>';
  $("more").style.display = left > 0 ? "inline-block" : "none";
  $("more").textContent = "Ver mais " + Math.min(5, Math.max(left, 0));
  $("results").style.display = "block";
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
  S.prev = final.length;
  loadProviders(final); renderSeen();
}
$("more").addEventListener("click", () => { S.more = (S.more || 0) + 1; showRecs(false, true); });

$("filters").addEventListener("change", () => { if (S) { S.more = 0; S.prev = 0; showRecs(false); } });

$("recs").addEventListener("click", e => {
  const b = e.target.closest(".seenbtn");
  if (b) { if (!S) return; const m = S.cands.find(x => x.id === +b.dataset.id); if (!m) return; const o = getSeen(); o[m.id] = m.title; setSeen(o); showRecs(false); return; }
  if (e.target.closest("a")) return;
  const c = e.target.closest(".pc"); if (c) c.classList.toggle("open");
});
function renderSeen() {
  const o = getSeen(), ids = Object.keys(o);
  $("seenBox").style.display = ids.length ? "block" : "none";
  $("seen").innerHTML = ids.map(i => `<span class="chip">${esc(o[i])}<button data-un="${i}" aria-label="Remover">×</button></span>`).join("");
}
$("seen").addEventListener("click", e => {
  const b = e.target.closest("[data-un]"); if (!b) return;
  const o = getSeen(); delete o[b.dataset.un]; setSeen(o); S ? showRecs(false) : renderSeen();
});

const provCache = {};
async function loadProviders(list) {
  await Promise.all(list.map(async m => {
    try {
      if (!provCache[m.id]) provCache[m.id] = (await api(`/movie/${m.id}/watch/providers`)).results?.BR || {};
      const d = provCache[m.id], el = $("p-" + m.id); if (!el) return;
      const row = (arr, l) => arr?.length ? `<div><small>${l}</small>${arr.slice(0, 6).map(p => `<img src="https://image.tmdb.org/t/p/w92${p.logo_path}" title="${esc(p.provider_name)}" alt="${esc(p.provider_name)}">`).join("")}</div>` : "";
      el.innerHTML = row(d.flatrate, "Streaming") + row(d.rent, "Alugar") + row(d.buy, "Comprar") || "<small>Sem informação de streaming no Brasil</small>";
    } catch {}
  }));
}
renderSeen();
loadGenres().then(loadClassics).catch(e => say("err", esc(e.message)));
</script>
</body>
